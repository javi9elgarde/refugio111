<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="64x64" href="logonavegador.png">
  <link rel="icon" type="image/png" sizes="512x512" href="logonuevo.png">
  <link rel="apple-touch-icon" href="logonuevo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Refugio 111 — Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css?v=20261029g">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/mobile-native.css?v=20261030m">
</head>
<body>

<div id="hub">

  <!-- Split background — cada imagen en su propio contenedor con overflow:hidden -->
  <div class="hub__split">
    <div class="hub__half hub__half--left">
      <img src="fondo_videojuegos_izq.jpg"  class="hub__split-img hub__split-img--left"  alt="Videojuegos" draggable="false">
    </div>
    <div class="hub__half hub__half--right">
      <img src="fondo_peliseriesanime_der.jpg" class="hub__split-img hub__split-img--right" alt="Cine y Series" draggable="false">
    </div>
  </div>

  <!-- Atmospheric color overlays -->
  <div class="hub__bg-left"  id="bgLeft"></div>
  <div class="hub__bg-right" id="bgRight"></div>

  <!-- Dim overlay for inactive side -->
  <div class="hub__dim-left"  id="dimLeft"></div>
  <div class="hub__dim-right" id="dimRight"></div>

  <!-- Scanlines retro overlay -->
  <div class="hub__scanlines"></div>

  <!-- Neon vignette edge glow -->
  <div class="hub__vignette" id="hubVignette"></div>

  <!-- Click/hover zones (encima de todo excepto UI) -->
  <div class="hub__zone hub__zone--left"  id="zoneLeft"></div>
  <div class="hub__zone hub__zone--right" id="zoneRight"></div>

  <!-- Línea divisoria central -->
  <div class="hub__divider"></div>

  <!-- Overlay flash en click -->
  <div class="hub__flash" id="hubFlash"></div>

  <!-- ── CHARACTER SELECTION ────────────────────────── -->
  <div class="psel" id="pselOverlay">
    <div class="psel__scanlines"></div>
    <button class="psel__back" id="pselBack">← VOLVER</button>
    <div class="psel__header">
      <h2 class="psel__title">¿QUIÉN JUEGA?</h2>
      <p class="psel__sub">Selecciona tu perfil para continuar</p>
    </div>
    <div class="psel__cards">
      <div class="psel__card psel__card--david" data-player="David">
        <div class="psel__glow"></div>
        <div class="psel__img-wrap">
          <video class="psel__img" poster="avatar_david_t.png" loop muted playsinline preload="none" aria-label="David"><source src="avatar_david.webm" type="video/webm"><source src="avatar_david.mp4" type="video/mp4"></video>
        </div>
        <div class="psel__name">DAVID</div>
      </div>
      <div class="psel__card psel__card--javi" data-player="Javi">
        <div class="psel__glow"></div>
        <div class="psel__img-wrap">
          <video class="psel__img" poster="avatar_javi_t.png" loop muted playsinline preload="none" aria-label="Javi"><source src="avatar_javi.webm" type="video/webm"><source src="avatar_javi.mp4" type="video/mp4"></video>
        </div>
        <div class="psel__name">JAVI</div>
      </div>
      <div class="psel__card psel__card--mery" data-player="Mery">
        <div class="psel__glow"></div>
        <div class="psel__img-wrap">
          <video class="psel__img" poster="avatar_mery_t.png" loop muted playsinline preload="none" aria-label="Mery"><source src="avatar_mery.webm" type="video/webm"><source src="avatar_mery.mp4" type="video/mp4"></video>
        </div>
        <div class="psel__name">MERY</div>
      </div>
    </div>
    <div class="psel__flash" id="pselFlash"></div>
  </div>

</div>

<script src="hub.js?v=20261030a"></script>
<script src="js/sync-manager.js?v=20261030m" defer></script>
<script src="js/mobile-ui.js?v=20261030m" defer></script>
<script src="app.js?v=20261023a" defer></script>
</body>
</html>
