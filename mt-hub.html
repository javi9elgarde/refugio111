<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="logonavegador.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Refugio 111 — Cine, Series y Anime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="mt-hub.css?v=20261029l">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- Fondo atmosférico -->
<div class="mth-bg">
  <div class="mth-bg__film"></div>
  <div class="mth-bg__glow mth-bg__glow--a"></div>
  <div class="mth-bg__glow mth-bg__glow--b"></div>
</div>

<!-- ── FASE 1: SELECCIÓN DE JUGADOR ────────────────────── -->
<div class="mth-phase" id="phasePlayer">

  <a href="hub.html" class="mth-back">← VOLVER</a>

  <div class="mth-header">
    <h2 class="mth-header__title">¿QUÉ VAS A VER HOY?</h2>
    <p class="mth-header__sub">Selecciona tu perfil para continuar</p>
  </div>

  <div class="mth-players">
    <div class="mth-pcard mth-pcard--david" data-player="David">
      <div class="mth-pcard__glow"></div>
      <div class="mth-pcard__img-wrap">
        <video class="mth-pcard__img" poster="mt_avatar_david_t.png" autoplay loop muted playsinline preload="auto" aria-label="David"><source src="mt_avatar_david.webm" type="video/webm"><source src="mt_avatar_david.mp4" type="video/mp4"></video>
      </div>
      <div class="mth-pcard__name">DAVID</div>
    </div>

    <div class="mth-pcard mth-pcard--javi" data-player="Javi">
      <div class="mth-pcard__glow"></div>
      <div class="mth-pcard__img-wrap">
        <video class="mth-pcard__img" poster="mt_avatar_javi_t.png" autoplay loop muted playsinline preload="auto" aria-label="Javi"><source src="mt_avatar_javi.webm" type="video/webm"><source src="mt_avatar_javi.mp4" type="video/mp4"></video>
      </div>
      <div class="mth-pcard__name">JAVI</div>
    </div>

    <div class="mth-pcard mth-pcard--mery" data-player="Mery">
      <div class="mth-pcard__glow"></div>
      <div class="mth-pcard__img-wrap">
        <video class="mth-pcard__img" poster="mt_avatar_mery_t.png" autoplay loop muted playsinline preload="auto" aria-label="Mery"><source src="mt_avatar_mery.webm" type="video/webm"><source src="mt_avatar_mery.mp4" type="video/mp4"></video>
      </div>
      <div class="mth-pcard__name">MERY</div>
    </div>
  </div>

</div>

<!-- ── FASE 2: SELECCIÓN DE CATEGORÍA ──────────────────── -->
<div class="mth-phase mth-phase--hidden" id="phaseCat">

  <div class="mth-greeting">Bienvenid@ a <span id="greetPlayer">—</span> 👋</div>

  <div class="mth-prompt">¿QUÉ QUIERES VER HOY?</div>

  <div class="mth-cats">
    <div class="mth-cat mth-cat--peliculas" data-cat="peliculas">
      <div class="mth-cat__icon">🎬</div>
      <div class="mth-cat__name">PELÍCULAS</div>
      <div class="mth-cat__desc">Cine · Documentales · Cortometrajes</div>
      <div class="mth-cat__enter">▶ ENTRAR</div>
    </div>

    <div class="mth-cat mth-cat--series" data-cat="series">
      <div class="mth-cat__icon">📺</div>
      <div class="mth-cat__name">SERIES</div>
      <div class="mth-cat__desc">TV · Miniseries · Streaming</div>
      <div class="mth-cat__enter">▶ ENTRAR</div>
    </div>

    <div class="mth-cat mth-cat--anime" data-cat="anime">
      <div class="mth-cat__icon">🌸</div>
      <div class="mth-cat__name">ANIME</div>
      <div class="mth-cat__desc">Shonen · Shojo · Seinen · Mecha</div>
      <div class="mth-cat__enter">▶ ENTRAR</div>
    </div>
  </div>

  <button class="mth-backplayer" id="backToPlayer">← Cambiar jugador</button>

</div>

<!-- Flash de transición -->
<div class="mth-flash" id="mthFlash"></div>

<script src="mt-hub.js?v=20261029k"></script>
<script src="app.js?v=20261023a" defer></script>
</body>
</html>
